[platformio]
default_envs = heltec-v4-sx1262
boards_dir = boards

[env:heltec-v4-sx1262]
platform = espressif32@6.13.0
board = heltec_v4
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = default_16MB.csv
lib_deps =
    jgromes/RadioLib@7.7.1
    thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays@4.6.2
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=0
