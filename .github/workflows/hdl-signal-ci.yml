name: HDL LoRa Signal CI

on:
  push:
    branches: [main, lora_cpp]  # Inspector and hdl/ sources live on main too
    paths:
      - "hdl/**"
      - "model/matlab/+lora_phy/**"
      - "model/matlab/apps/lora_phy_inspector.m"
      - "model/matlab/tests/TestIqInspector.m"
      - "model/matlab/tests/TestTxCheckpointVerification.m"
      - "model/matlab/run_hdl_inspector_regression.m"
      - ".github/workflows/hdl-signal-ci.yml"
  pull_request:
    paths:
      - "hdl/**"
      - "model/matlab/+lora_phy/**"
      - "model/matlab/apps/lora_phy_inspector.m"
      - "model/matlab/tests/TestIqInspector.m"
      - "model/matlab/tests/TestTxCheckpointVerification.m"
      - "model/matlab/run_hdl_inspector_regression.m"
      - ".github/workflows/hdl-signal-ci.yml"

permissions:
  contents: read

concurrency:
  group: lora-hdl-signal-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  golden-regression:
    name: SF5/SF6/SF7 (L16) HDL signal golden regression
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - name: Reject committed generated PCM recordings
        run: |
          tracked_pcm="$(git ls-files 'hdl/signal/*.pcm')"
          if [ -n "$tracked_pcm" ]; then
            echo "Generated HDL PCM recordings must not be committed."
            echo "They are ignored by .gitignore and published as CI artifacts instead:"
            echo "$tracked_pcm"
            exit 1
          fi

      - name: Install GHDL
        run: |
          sudo apt-get update
          sudo apt-get install -y ghdl

      - name: Check DDS IP interface configuration
        shell: python
        run: |
          import xml.etree.ElementTree as ET
          from pathlib import Path

          path = Path("hdl/ip/dds_sin_cos_only.xci")
          root = ET.parse(path).getroot()
          values = {}
          for node in root.iter():
              ref = next(
                  (value for key, value in node.attrib.items()
                   if key.endswith("referenceId")),
                  None,
              )
              if ref:
                  values[ref] = (node.text or "").strip()

          expected = {
              "MODELPARAM_VALUE.C_HAS_PHASEGEN": "0",
              "MODELPARAM_VALUE.C_HAS_SINCOS": "1",
              "MODELPARAM_VALUE.C_HAS_S_PHASE": "1",
              "MODELPARAM_VALUE.C_PHASE_ANGLE_WIDTH": "16",
              "MODELPARAM_VALUE.C_S_PHASE_TDATA_WIDTH": "16",
              "MODELPARAM_VALUE.C_OUTPUT_WIDTH": "16",
              "MODELPARAM_VALUE.C_M_DATA_TDATA_WIDTH": "32",
          }
          for key, wanted in expected.items():
              got = values.get(key)
              if got != wanted:
                  raise SystemExit(f"{key}: expected {wanted}, got {got}")
          print("DDS IP interface configuration PASS")

      - name: Compile production VHDL with behavioral IP models
        run: |
          mkdir -p build/ghdl-lora
          ghdl -a --std=08 --workdir=build/ghdl-lora hdl/tb/dds_sin_cos_only_stub.vhd
          ghdl -a --std=08 --workdir=build/ghdl-lora hdl/tb/fifo_1024_32_stub.vhd
          ghdl -a --std=08 --workdir=build/ghdl-lora hdl/tb/ci16_file_io_pkg.vhd
          ghdl -a --std=08 --workdir=build/ghdl-lora hdl/srcs/phase_to_sample.vhd
          ghdl -a --std=08 --workdir=build/ghdl-lora hdl/srcs/formiration_chirp.vhd
          ghdl -a --std=08 --workdir=build/ghdl-lora hdl/srcs/formiration_package.vhd
          ghdl -a --std=08 --workdir=build/ghdl-lora hdl/tb/test_formiration_chirp_golden.vhd
          ghdl -a --std=08 --workdir=build/ghdl-lora hdl/tb/test_formiration_package_golden.vhd
          ghdl -e --std=08 --workdir=build/ghdl-lora test_formiration_chirp_golden
          ghdl -e --std=08 --workdir=build/ghdl-lora test_formiration_package_golden

      - name: Verify CI16 file writer and package testbench
        run: |
          ghdl -a --std=08 --workdir=build/ghdl-lora hdl/tb/test_formiration_package.vhd
          ghdl -a --std=08 --workdir=build/ghdl-lora hdl/tb/test_ci16_file_io.vhd
          ghdl -e --std=08 --workdir=build/ghdl-lora test_ci16_file_io
          ghdl -r --std=08 --workdir=build/ghdl-lora test_ci16_file_io

          python - <<'PY'
          from pathlib import Path

          path = Path("build/ghdl-lora/ci16_writer_test.pcm")
          actual = path.read_bytes()
          expected = bytes.fromhex("00 40 00 E0 00 C0 00 20")
          if actual != expected:
              raise SystemExit(
                  f"CI16 byte order mismatch: expected {expected.hex()}, got {actual.hex()}"
              )
          print("CI16 byte layout PASS:", actual.hex(" "))
          PY

      - name: Verify all SF5/SF6/SF7 symbols against MATLAB golden convention
        run: |
          ghdl -r --std=08 --workdir=build/ghdl-lora test_formiration_chirp_golden \
            --assert-level=error --stop-time=10ms

      - name: Verify SF5/SF6/SF7 package waveforms and generate CI16 captures
        run: |
          ghdl -r --std=08 --workdir=build/ghdl-lora test_formiration_package_golden \
            --assert-level=error --stop-time=2ms
          test -s build/ghdl-lora/hdl_sf7_bw125k_fs2000k_package.pcm
          test "$(stat -c%s build/ghdl-lora/hdl_sf7_bw125k_fs2000k_package.pcm)" -eq 81920
          test "$(stat -c%s build/ghdl-lora/hdl_sf5_bw125k_fs2000k_package.pcm)" -eq 20480
          test "$(stat -c%s build/ghdl-lora/hdl_sf6_bw125k_fs2000k_package.pcm)" -eq 40960

      - name: Set up MATLAB for Inspector end-to-end regression
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2025a

      - name: Run Inspector MATLAB unit tests
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('model/matlab'); iqResults = runtests('model/matlab/tests/TestIqInspector.m'); assertSuccess(iqResults); txResults = runtests('model/matlab/tests/TestTxCheckpointVerification.m'); assertSuccess(txResults);

      - name: Smoke-test hidden Inspector UI
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('model/matlab'); addpath('model/matlab/apps'); app = lora_phy_inspector("off", Language="ru"); assert(isvalid(app.Figure)); close(app.Figure);

      - name: Inspect generated HDL CI16 capture
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('model/matlab'); report = run_hdl_inspector_regression("build/ghdl-lora/hdl_sf7_bw125k_fs2000k_package.pcm", ReportPath="build/ghdl-lora/hdl_inspector_regression.csv"); assert(report.goldenPassed);

      - name: Verify Stage 2 golden checkpoint for SF5/SF6 packages
        # run_hdl_inspector_regression is intentionally not used here: its
        # blind SF/BW estimator (inspect_iq_capture) misdetects the SF6
        # package as SF5, a pre-existing estimator accuracy limit unrelated
        # to the Stage 2 golden contract checked below, which uses the SF
        # declared by the filename/acquisition metadata, not a blind guess.
        # Tracked as a separate follow-up.
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('model/matlab'); files = ["build/ghdl-lora/hdl_sf5_bw125k_fs2000k_package.pcm", "build/ghdl-lora/hdl_sf6_bw125k_fs2000k_package.pcm"]; for f = files, metadata = lora_phy.parse_hdl_recording_name(f); [iq, ~] = lora_phy.load_iq_capture(f, "ci16"); checkpoint = lora_phy.verify_tx_checkpoint(iq, metadata); assert(checkpoint.verdict == "PASS", "Stage 2 checkpoint failed for %s -- %s", f, checkpoint.summary); fprintf("%s -- %s\n", f, checkpoint.summary); end

      - name: Upload HDL Inspector evidence
        uses: actions/upload-artifact@v7
        with:
          name: hdl-inspector-end-to-end
          path: |
            build/ghdl-lora/hdl_sf7_bw125k_fs2000k_package.pcm
            build/ghdl-lora/hdl_inspector_regression.csv
            build/ghdl-lora/hdl_sf5_bw125k_fs2000k_package.pcm
            build/ghdl-lora/hdl_sf6_bw125k_fs2000k_package.pcm
          if-no-files-found: error
