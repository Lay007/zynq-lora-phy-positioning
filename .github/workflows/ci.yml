name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: lora-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Auxiliary Python checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: pytest

  rtl-wrapper-smoke:
    name: RTL integration wrapper smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5
      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog
      - name: Compile and run PL sample counter testbench
        run: |
          iverilog -g2012 \
            -o /tmp/lora_sample_counter_capture_tb \
            fpga/wrappers/lora_sample_counter_capture.v \
            fpga/tb/tb_lora_sample_counter_capture.sv
          vvp /tmp/lora_sample_counter_capture_tb
      - name: Compile and run ToA peak triplet capture testbench
        run: |
          iverilog -g2012 -Wall \
            -o /tmp/lora_peak_triplet_capture_tb \
            fpga/wrappers/lora_peak_triplet_capture.v \
            fpga/tb/tb_lora_peak_triplet_capture.sv
          vvp /tmp/lora_peak_triplet_capture_tb
      - name: Compile and run detector timestamp aligner testbench
        run: |
          iverilog -g2012 \
            -o /tmp/lora_detector_timestamp_align_tb \
            fpga/wrappers/lora_detector_timestamp_align.v \
            fpga/tb/tb_lora_detector_timestamp_align.sv
          vvp /tmp/lora_detector_timestamp_align_tb
      - name: Compile and run generated detector timestamp path testbench
        run: |
          iverilog -g2012 -Wall \
            -o /tmp/lora_detector_timestamp_path_tb \
            fpga/generated/blind-detector/lora_blind_detector_gen/BlindDetector.v \
            fpga/wrappers/lora_detector_timestamp_align.v \
            fpga/wrappers/lora_detector_timestamp_path.v \
            fpga/tb/tb_lora_detector_timestamp_path.sv
          vvp /tmp/lora_detector_timestamp_path_tb
      - name: Compile and run IQ to packet timestamp testbench
        run: |
          iverilog -g2012 -Wall -s tb_lora_fft_detector_timestamp_path \
            -o /tmp/lora_fft_detector_timestamp_path_tb \
            fpga/generated/fft-correlator-fixed/lora_fft_correlator_gen/*.v \
            fpga/generated/blind-detector/lora_blind_detector_gen/BlindDetector.v \
            fpga/wrappers/fft_correlator_route_top.v \
            fpga/wrappers/lora_detector_timestamp_align.v \
            fpga/wrappers/lora_detector_timestamp_path.v \
            fpga/wrappers/lora_fft_detector_timestamp_path.v \
            fpga/tb/tb_lora_fft_detector_timestamp_path.sv
          vvp /tmp/lora_fft_detector_timestamp_path_tb
      - name: Compile and run IQ to AXI packet timestamp testbench
        run: |
          iverilog -g2012 -Wall -s tb_lora_packet_timestamp_axi_path \
            -o /tmp/lora_packet_timestamp_axi_path_tb \
            fpga/generated/fft-correlator-fixed/lora_fft_correlator_gen/*.v \
            fpga/generated/blind-detector/lora_blind_detector_gen/BlindDetector.v \
            fpga/generated/toa-interpolator/lora_toa_interpolator_gen/ToaInterpolator.v \
            fpga/wrappers/fft_correlator_route_top.v \
            fpga/wrappers/lora_detector_timestamp_align.v \
            fpga/wrappers/lora_detector_timestamp_path.v \
            fpga/wrappers/lora_fft_detector_timestamp_path.v \
            fpga/wrappers/lora_timestamp_metadata_join.v \
            fpga/wrappers/lora_axi_lite_status.v \
            fpga/wrappers/lora_packet_timestamp_axi_path.v \
            fpga/tb/tb_lora_packet_timestamp_axi_path.sv
          vvp /tmp/lora_packet_timestamp_axi_path_tb
      - name: Compile and run timestamp metadata joiner testbench
        run: |
          iverilog -g2012 \
            -o /tmp/timestamp_metadata_join_tb \
            fpga/wrappers/lora_timestamp_metadata_join.v \
            fpga/tb/tb_lora_timestamp_metadata_join.sv
          vvp /tmp/timestamp_metadata_join_tb
      - name: Compile and run AXI-Lite status register testbench
        run: |
          iverilog -g2012 \
            -o /tmp/lora_axi_lite_status_tb \
            fpga/wrappers/lora_axi_lite_status.v \
            fpga/tb/tb_lora_axi_lite_status.sv
          vvp /tmp/lora_axi_lite_status_tb
      - name: Compile and run receiver control wrapper integration testbench
        run: |
          iverilog -g2012 \
            -o /tmp/lora_receiver_control_wrapper_tb \
            fpga/wrappers/lora_sample_counter_capture.v \
            fpga/wrappers/lora_timestamp_metadata_join.v \
            fpga/wrappers/lora_axi_lite_status.v \
            fpga/wrappers/lora_receiver_control_wrapper.v \
            fpga/tb/tb_lora_receiver_control_wrapper.sv
          vvp /tmp/lora_receiver_control_wrapper_tb

  matlab:
    name: Authoritative MATLAB and Simulink tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # The tests build their own signals and write to tempname, so the Git LFS
      # reference captures are deliberately not fetched here.
      - uses: actions/checkout@v5
      - name: Set up MATLAB and Simulink
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2025a
          products: Simulink
      - name: Run floating-point model regression suite
        uses: matlab-actions/run-command@v3
        with:
          command: cd('model/matlab'); results = run_tests; assertSuccess(results);
      - name: Run timestamp metadata regression
        uses: matlab-actions/run-command@v3
        with:
          command: cd('model/simulink'); report = run_timestamp_metadata_regression(WriteCsv=true, Verbose=true); assert(report.passed);
      - name: Upload timestamp metadata evidence
        uses: actions/upload-artifact@v7
        with:
          name: timestamp-metadata-regression
          path: docs/data/simulink-m2-timestamp-metadata.csv
          if-no-files-found: error
